<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Overview | Oakcraft Daily Working Tracker</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F3F5F9">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/IBMPlexSans-Regular-Latin1.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/IBMPlexSans-SemiBold-Latin1.woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <noscript><p style="padding:24px">The Oakcraft tracker needs JavaScript. Enable it in your browser settings.</p></noscript>
  <div class="content" role="status"><p class="muted">One moment, getting your workspace ready…</p></div>
  <script type="module" src="js/prefetch.js"></script>
  <script type="module">
    import { boot } from './js/app.js';
    import { renderOverview, renderDailySummary, renderDepartmentAnalytics } from './js/dashboard.js';
    boot({
      page: 'dashboard',
      roles: ['ADMIN', 'MANAGER'],
      defaultRoute: 'overview',
      routes: {
        overview: { render: renderOverview },
        summary: { render: renderDailySummary },
        department: { render: renderDepartmentAnalytics }
      }
    });
  </script>
</body>
</html>
