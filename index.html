<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oakcraft Daily Working Tracker</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-main" style="min-height:100vh">
    <p class="muted" role="status">Opening the tracker…</p>
  </main>
  <script type="module">
    import { isConfigured } from './js/api.js';
    import { loadSession, homeFor } from './js/auth.js';
    import { renderSetupRequired } from './js/app.js';
    (async () => {
      if (!isConfigured()) { renderSetupRequired(); return; }
      try {
        const s = await loadSession(true);
        if (!s) { location.replace('login.html'); return; }
        location.replace(s.user.mustChangePassword ? 'login.html#change' : homeFor(s.user));
      } catch (e) {
        location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
