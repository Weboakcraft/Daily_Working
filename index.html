<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oakcraft Daily Working Tracker</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/IBMPlexSans-Regular-Latin1.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/IBMPlexSans-SemiBold-Latin1.woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-main" style="min-height:100vh">
    <p class="muted" role="status">Opening the tracker…</p>
  </main>
  <script type="module" src="js/prefetch.js"></script>
  <script type="module">
    /*
     * This page only decides where to send you. It used to wait for a round-trip to Apps Script
     * first — about a second and a half of blank screen — and then the page it redirected to
     * asked the very same question again. Now it redirects straight away using the landing page
     * remembered from last time; the page it opens verifies the session and bounces to the login
     * screen itself if the token has gone stale.
     */
    import { isConfigured, getToken } from './js/api.js';
    import { loadSession, homeFor, homeHint } from './js/auth.js';
    import { renderSetupRequired } from './js/app.js';
    (async () => {
      if (!isConfigured()) { renderSetupRequired(); return; }
      if (!getToken()) { location.replace('login.html'); return; }
      const hint = homeHint();
      if (hint) { location.replace(hint); return; }
      try {
        const s = await loadSession(false);
        if (!s) { location.replace('login.html'); return; }
        location.replace(s.user.mustChangePassword ? 'login.html#change' : homeFor(s.user));
      } catch (e) {
        location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
