# Unpacks any .zip file uploaded to this repository, commits the extracted files, and deletes the zip.
#
# How to use:
#   1. Add this file to the repository as .github/workflows/unpack.yml
#   2. Upload the project zip with "Add file > Upload files" and commit.
#   3. Open the Actions tab and wait for "Unpack uploaded zip" to finish (about 30 seconds).
#
# Notes:
#   - If the zip has a single top-level folder (for example oakcraft-daily-working-tracker/),
#     its contents are placed at the repository root so index.html ends up at the top level.
#   - The Web App URL already saved in js/config.js is carried over into the uploaded file. Every
#     other setting in that file (APP_VERSION, timeouts, autosave) comes from the zip.
#   - Existing files with the same name are replaced; other files in the repository are left alone.
#   - Anything under .github/workflows/ in the zip is ignored: GitHub does not let an Action update
#     its own workflow files, and a zip containing one would make the push fail.
#   - Archives containing absolute paths or ".." are refused.

name: Unpack uploaded zip

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-zip
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Unpack zip files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob

          mapfile -t zips < <(git ls-files '*.zip')
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No zip files found in the repository. Nothing to do."
            exit 0
          fi

          for zip in "${zips[@]}"; do
            echo "::group::Unpacking $zip"

            if unzip -Z1 "$zip" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "::error::$zip contains unsafe paths (absolute or '..'). It was not unpacked."
              echo "::endgroup::"
              exit 1
            fi

            tmp="$(mktemp -d)"
            unzip -q -o "$zip" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            find "$tmp" -name '.DS_Store' -delete

            src="$tmp"
            entries=("$tmp"/*)
            if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
              echo "Using the contents of the top-level folder: $(basename "$src")"
            fi

            # Carry over only the Web App URL, not the whole file. Keeping the whole file meant
            # every other setting in js/config.js — the app version, the autosave interval, the
            # request timeout — was silently thrown away on every upload, so those changes never
            # reached anyone and nobody could see why.
            keep_url=""
            if [ -f js/config.js ]; then
              keep_url="$(sed -n "s/.*APPS_SCRIPT_URL:[[:space:]]*'\([^']*\)'.*/\1/p" js/config.js | head -n1)"
              case "$keep_url" in PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE*) keep_url="" ;; esac
            fi

            rm -rf "$src/.git"
            # GITHUB_TOKEN is not allowed to create or update workflow files, so a zip that happens
            # to carry a changed .github/workflows/*.yml makes the whole push fail — the unpack
            # looks like it worked and then nothing lands. Workflow files are edited in the
            # repository directly, never through an upload.
            if [ -d "$src/.github/workflows" ]; then
              echo "Ignoring .github/workflows in the zip (edit workflow files in the repository instead)"
              rm -rf "$src/.github/workflows"
            fi
            cp -a "$src"/. ./

            if [ -n "$keep_url" ]; then
              if [ -f js/config.js ] && grep -q "APPS_SCRIPT_URL:" js/config.js; then
                sed -i "s|APPS_SCRIPT_URL:[[:space:]]*'[^']*'|APPS_SCRIPT_URL: '$keep_url'|" js/config.js
                echo "Kept the existing Web App URL in js/config.js; every other setting came from the zip"
              else
                echo "::warning::The uploaded js/config.js has no APPS_SCRIPT_URL line. Paste the Web App URL in by hand."
              fi
            fi

            rm -f "$zip"
            rm -rf "$tmp"
            echo "Unpacked $zip"
            echo "::endgroup::"
          done

      - name: Commit the unpacked files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Unpack uploaded zip"
          git push
          echo "Done. The unpacked files are now in the repository."
